[package]
name = "ui"
description = "The single re-export of the Isonomic component library."
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
publish.workspace = true

[features]
# Headless windows and screenshots, for tests and the screenshot tool.
test-support = ["isonomic-ui/test-support"]

[dependencies]
# Isonomic UI, pinned to one commit of its main branch. This is the only place the component
# library is named; move the pin forward deliberately, together with Cargo.lock.
isonomic-ui = { git = "https://github.com/isonomic-org/isonomic-ui", rev = "5cdf1341cbdc8e34a899ea031b4ae1f4a0b860ee" }

[lints]
workspace = true
