[package]
name = "ui"
description = "The single re-export of the Isonomic component library."
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Headless windows and screenshots, for tests and the screenshot tool.
test-support = ["isonomic-ui/test-support"]

[dependencies]
# Isonomic UI is a sibling checkout (../isonomic-ui next to this repository) at the commit in
# UI_REF; CI checks it out there with the UI_DEPLOY_KEY secret. This is the only place the
# component library is named. Move UI_REF forward deliberately, together with Cargo.lock.
isonomic-ui = { path = "../../../isonomic-ui/crates/ui" }

[lints]
workspace = true
