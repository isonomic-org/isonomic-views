[package]
name = "views-gpui"
description = "Renders an Isonomic View into native components."
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Offscreen rendering for screenshots and the report.
headless = ["ui/test-support", "dep:image"]

[dependencies]
ui.workspace = true
views-expr.workspace = true
views-ir.workspace = true
views-runtime.workspace = true
views-catalog.workspace = true
serde_json.workspace = true
chrono = { version = "0.4", default-features = false, features = ["std"] }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

[dev-dependencies]
ui = { workspace = true, features = ["test-support"] }

[[bin]]
name = "views-shots"
path = "src/bin/shots.rs"
required-features = ["headless"]

[[bin]]
name = "views-report"
path = "src/bin/report.rs"
required-features = ["headless"]

# Runs on the main thread: see the comment at the top of the file.
[[test]]
name = "live"
harness = false

[lints]
workspace = true
