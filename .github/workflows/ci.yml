name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    uses: isonomic-org/.github/.github/workflows/rust-ci.yml@main
    secrets: inherit
    with:
      # macOS runs only when started by hand, to keep within the Actions budget.
      os: ${{ github.event_name == 'workflow_dispatch' && '["ubuntu-latest", "macos-latest"]' || '["ubuntu-latest"]' }}
      # cargo fmt --all also checks the sibling isonomic-ui checkout, which is formatted
      # with 1.98; newer rustfmt lays out some macro arguments differently.
      toolchain: "1.98"
      ui: true
      linux-gui-libs: true
      apt-packages: mesa-vulkan-drivers
      xtask: deps screenshots
      artifacts: target/screenshots
