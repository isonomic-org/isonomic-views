name: CI

# Self-contained until isonomic-org/.github provides the shared workflow; then this becomes
#   jobs: { rust: { uses: isonomic-org/.github/.github/workflows/rust-ci.yml@main } }

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  headless:
    name: headless crates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: headless
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: dependency allow-list
        if: hashFiles('xtask/Cargo.toml') != ''
        run: cargo xtask deps

  render:
    name: renderer and screenshots
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        if: hashFiles('crates/views-gpui/Cargo.toml') != ''
        with:
          components: clippy
      - name: system libraries
        if: hashFiles('crates/views-gpui/Cargo.toml') != ''
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq mesa-vulkan-drivers libvulkan-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb1-dev libx11-xcb-dev libasound2-dev libfontconfig-dev libfreetype-dev libssl-dev
      - uses: Swatinem/rust-cache@v2
        if: hashFiles('crates/views-gpui/Cargo.toml') != ''
        with:
          key: render
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
        if: hashFiles('crates/views-gpui/Cargo.toml') != ''
      - run: cargo test --workspace
        if: hashFiles('crates/views-gpui/Cargo.toml') != ''
      - name: screenshots
        if: hashFiles('xtask/Cargo.toml') != '' && hashFiles('crates/views-gpui/Cargo.toml') != ''
        run: cargo xtask screenshots
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('target/screenshots/*.png') != ''
        with:
          name: screenshots
          path: target/screenshots/
