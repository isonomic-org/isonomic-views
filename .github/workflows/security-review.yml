# Security review of the files a pull request changes.
#
# Keep this file identical in every repository that carries it.
#
# Runs on same-repo pull requests only, on Linux only. It does nothing and
# passes when the SECURITY_REVIEW_KEY secret is not set, so it is safe to
# land before the key exists. The analyze job fails when the review finds
# something new in the changed files; the comment job then posts the
# findings on the pull request.
#
# The analyze job runs pull request code with the key in scope but with
# read-only repository permissions. Only the comment job can write, and it
# runs no pull request code: it reads the findings file and posts it.

name: security-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "**/*.md"
      - "LICENSE*"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  analyze:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - id: key
        env:
          KEY: ${{ secrets.SECURITY_REVIEW_KEY }}
        run: |
          if [ -n "$KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::SECURITY_REVIEW_KEY is not set; skipping."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.key.outputs.present == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - if: steps.key.outputs.present == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - if: steps.key.outputs.present == 'true'
        run: npm install -g @anthropic-ai/claude-code@2.1.332

      - if: steps.key.outputs.present == 'true'
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.SECURITY_REVIEW_KEY }}
          CLAUDE_CODE_EXECUTABLE: claude
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          npx -y deepsec@2.3.16 process \
            --agent claude \
            --model claude-sonnet-4-6 \
            --thinking-level medium \
            --root . \
            --diff "origin/${BASE_REF}" \
            --comment-out "${RUNNER_TEMP}/findings.md"

      - if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-review-findings
          path: ${{ runner.temp }}/findings.md
          if-no-files-found: ignore
          retention-days: 1

  comment:
    needs: analyze
    if: always() && needs.analyze.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - id: dl
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: security-review-findings

      - if: steps.dl.outcome == 'success' && hashFiles('findings.md') != ''
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            // Plain text only: drop pictographs and the tool's footer line.
            const body = fs.readFileSync('findings.md', 'utf8')
              .split('\n')
              .filter((line) => !/generated by \[/i.test(line))
              .join('\n')
              .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]\s?/gu, '')
              .trim();
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
